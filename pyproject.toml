[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tapas"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Complexity72h" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru>=0.7.2",
    "matplotlib>=3.10.8",
    "networkx>=3.2",
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "pip>=23.0",
    "python-dotenv>=1.0.0",
    "python-louvain>=0.16",
    "requests>=2.31.0",
    "ruff>=0.1.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
]
requires-python = ">=3.10,<3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]


[tool.ruff]
line-length = 99
src = ["tapas"]
include = ["pyproject.toml", "tapas/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tapas"]
force-sort-within-sections = true

